---

# matrix-identity-server — Matrix Identity Service (IS)
# Lightweight identity server for phone/email → Matrix ID lookup.
# Uses msisd-rs or sydent depending on image configuration.

matrix_identity_server_ansible_name: "Matrix Identity Server"

matrix_identity_server_enabled: true

matrix_identity_server_version: "latest"

matrix_identity_server_base_path: "{{ matrix_base_data_path }}/identity-server"
matrix_identity_server_config_path: "{{ matrix_identity_server_base_path }}/config"
matrix_identity_server_env_file: "{{ matrix_identity_server_config_path }}/.env"

# Docker image — override in host vars for specific deployment.
# Options:
#   ghcr.io/tweedegolf/msisd-rs:latest  (Rust, lightweight, arm64)
#   matrixdotorg/sydent:latest           (Python, official Matrix IS)
matrix_identity_server_container_image: "{{ matrix_identity_server_container_image_registry_prefix }}ghcr.io/tweedegolf/msisd-rs:{{ matrix_identity_server_version }}"
matrix_identity_server_container_image_registry_prefix: "{{ matrix_identity_server_container_image_registry_prefix_upstream }}"
matrix_identity_server_container_image_registry_prefix_upstream: ""

matrix_identity_server_container_network: "{{ matrix_addons_container_network }}"
matrix_identity_server_container_additional_networks: "{{ [matrix_playbook_reverse_proxyable_services_additional_network] if matrix_playbook_reverse_proxy_type in ['playbook-managed-traefik', 'other-traefik-container'] else [] }}"

# Traefik routing
matrix_identity_server_container_labels_traefik_enabled: "{{ matrix_playbook_reverse_proxy_type in ['playbook-managed-traefik', 'other-traefik-container'] }}"
matrix_identity_server_container_labels_traefik_docker_network: "{{ matrix_playbook_reverse_proxyable_services_additional_network }}"
matrix_identity_server_container_labels_traefik_entrypoints: "{{ traefik_entrypoint_primary }}"
matrix_identity_server_container_labels_traefik_tls_certResolver: "{{ traefik_certResolver_primary }}"

matrix_identity_server_hostname: "identity.{{ matrix_domain }}"

matrix_identity_server_container_name: "matrix-identity-server"
matrix_identity_server_container_http_port: 8090
matrix_identity_server_container_extra_arguments: []

matrix_identity_server_systemd_required_services_list: "{{ [devture_systemd_docker_base_docker_service_name] }}"
matrix_identity_server_systemd_wanted_services_list: []
matrix_identity_server_systemd_service_basename: "matrix-identity-server"
matrix_identity_server_systemd_service_name: "{{ matrix_identity_server_systemd_service_basename }}.service"

# IS configuration
matrix_identity_server_bind_address: "0.0.0.0:8090"
matrix_identity_server_database_path: "{{ matrix_identity_server_base_path }}/data"

matrix_identity_server_restart_necessary: false
